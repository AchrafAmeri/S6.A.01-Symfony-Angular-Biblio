<div class="container mt-4">
  <h2>Catégories de la Bibliothèque</h2>
  <table class="table table-striped">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nom de la catégorie</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      @for (cat of categories(); track cat.id) {
        <tr>
          <td>{{ cat.id }}</td>
          <td>{{ cat.nom }}</td>
          <td>
            <a
              [routerLink]="['/livres']"
              [queryParams]="{ categorie: cat.id }"
              class="btn btn-sm btn-primary"
            >
              Voir les livres
            </a>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
