<div class="container mt-4">
  @if (auteur(); as a) {
    <div class="card shadow-sm border-0">
      <div class="row g-0">
        <div class="col-md-4 text-center p-5 bg-light d-flex align-items-center justify-content-center">
          @if (a.photo) {
            <img [src]="a.photo" class="img-fluid rounded shadow" alt="Photo de {{ a.prenom }}">
          } @else {
            <div class="bg-secondary text-white rounded d-flex align-items-center justify-content-center" style="width: 200px; height: 250px;">
              <span>Pas de photo</span>
            </div>
          }
        </div>
        <div class="col-md-8">
          <div class="card-body p-5">
            <h2 class="card-title text-primary display-6">{{ a.prenom }} {{ a.nom }}</h2>
            
            <h5 class="mt-4 text-secondary">Biographie</h5>
            <p class="text-muted lh-lg" style="white-space: pre-wrap;">
              {{ a.description || 'La biographie de cet auteur n\'est pas encore disponible dans notre base de données.' }}
            </p>
            
            <hr class="my-4">
            
            <a routerLink="/auteurs" class="btn btn-outline-secondary px-4">⬅ Revenir à la liste</a>
          </div>
        </div>
      </div>
    </div>
  } @else {
    <div class="text-center mt-5">
      <div class="spinner-border text-primary" role="status"></div>
      <h4 class="mt-3 text-muted">Chargement de la fiche auteur...</h4>
    </div>
  }
</div>
